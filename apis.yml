aid: prized
name: Prized
description: >-
  Prized is an AI-powered platform that lets non-technical operations, support,
  and finance teams build, deploy, and share secure internal tools without
  engineering. Users describe a workflow in natural language (or bring their own
  coding agent such as Claude Code) and Prized builds real software on company
  data that is pre-connected and scoped, with least-privilege database access
  per tool, credential isolation, outbound-traffic proxying, and an audit trail
  on every access. Tools deploy behind corporate authentication and connect to
  20+ services including Salesforce, Postgres, Slack, Stripe, and Notion. Prized
  is a Y Combinator (Summer 2026) company founded by Hudson Griffith and Marinos
  Eliades, both formerly of Gander (YC F24, acquired by Archer Aviation). Added
  to the API Evangelist network via the VC-portfolio pipeline and enriched from
  the company's public web surface.
